<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">World News icon</title>
  <desc id="desc">A dark app tile with a folded newspaper and international news accents.</desc>
